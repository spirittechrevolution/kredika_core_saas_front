version: '3.8'

services:
  kredika-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kredika-frontend
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - kredika-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  kredika-network:
    driver: bridge

